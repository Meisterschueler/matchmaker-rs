# Benchmark datasets (T049). tools/datasets/fetch.py downloads them at the pinned commit (the
# git commit hash verifies the content) into a cache directory. They are never committed or
# uploaded as artifacts: their licenses differ from this repository's Apache-2.0. The benchmark
# report only publishes derived metrics, with the attribution below (non-commercial use).

[nasap]
name = "(n)ASAP"
repo = "https://github.com/CPJKU/asap-dataset"
commit = "4097b45757bed854818cf87e77b92323ebf90615" # tag v2.1.1
license = "CC BY-NC-SA 4.0"
citation = "S. D. Peter et al., Automatic Note-Level Score-to-Performance Alignments in the ASAP Dataset, TISMIR 2023, doi:10.5334/tismir.149"

