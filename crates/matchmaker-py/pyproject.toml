[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "matchmaker-rs"
description = "Rust port of pymatchmaker: drop-in Matchmaker for MIDI score following"
requires-python = ">=3.10,<3.14"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.26"]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.maturin]
module-name = "matchmaker_rs"
features = ["pyo3/extension-module"]
