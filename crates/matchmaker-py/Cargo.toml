[package]
name = "matchmaker-py"
description = "Python bindings of matchmaker-rs (drop-in for pymatchmaker's MIDI API)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "matchmaker_rs"
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
matchmaker-rs = { path = "../.." }
numpy = "0.30.0"
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }
