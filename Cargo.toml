[workspace]
members = [".", "crates/matchmaker-cli", "crates/matchmaker-py"]
default-members = [".", "crates/matchmaker-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Meisterschueler/matchmaker-rs"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[package]
name = "matchmaker-rs"
description = "Pure-Rust port of pymatchmaker (real-time music alignment / score following)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
midly = { version = "0.5.3", default-features = false, features = ["std"] }
realfft = "3.5.1"
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
zip = { version = "7.3.0", default-features = false, features = ["deflate"] }
